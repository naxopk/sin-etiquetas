<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=IBM+Plex+Mono:wght@500&family=Public+Sans:wght@400;600&display=block">
<style>
  html,body{margin:0;width:1200px;height:630px;overflow:hidden}
  body{background:#EEF0EB;color:#17191C;font-family:"Public Sans",sans-serif;position:relative}
  .frame{position:absolute;inset:44px;border:3px solid #17191C;border-radius:10px;padding:56px 64px;display:grid;grid-template-rows:auto 1fr auto}
  .brand{display:flex;align-items:center;gap:18px;font-family:"Archivo";font-stretch:118%;font-weight:850;font-size:30px;letter-spacing:.04em;text-transform:uppercase}
  h1{font-family:"Archivo";font-stretch:112%;font-weight:850;font-size:84px;line-height:1.02;margin:34px 0 0;letter-spacing:-.01em;max-width:900px}
  h1 em{font-style:normal;color:#8A5620}
  .foot{display:flex;justify-content:space-between;align-items:flex-end;font-family:"IBM Plex Mono";font-size:24px;letter-spacing:.04em;color:#4D525A}
  .foot b{color:#17191C;font-weight:500}
  .stamp{position:absolute;right:84px;top:80px;width:210px;height:210px;border:5px solid #8A5620;border-radius:50%;display:grid;place-items:center;transform:rotate(-14deg);color:#8A5620;font-family:"Archivo";font-stretch:120%;font-weight:850;font-size:18px;text-align:center;line-height:1.35;letter-spacing:.06em}
  .stamp::before{content:"";position:absolute;inset:9px;border:2px solid #8A5620;border-radius:50%}
</style></head>
<body>
  <div class="frame">
    <div class="brand"><svg width="52" height="52" viewBox="0 0 40 40"><rect x="3" y="3" width="34" height="34" rx="4" fill="none" stroke="#17191C" stroke-width="3.5"/><path d="M12 12 L28 28 M28 12 L12 28" stroke="#8A5620" stroke-width="5" stroke-linecap="round"/></svg>Sin Etiquetas</div>
    <h1>Vota por lo que piensas, <em>no por quién lo dice.</em></h1>
    <div class="foot"><span>Test electoral · Generales 29N 2026</span><b>votasinetiquetas.es</b></div>
  </div>
  <div class="stamp">SIN SIGLAS<br>· NI ·<br>ETIQUETAS</div>
</body></html>
