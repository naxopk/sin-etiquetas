<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=block">
<style>
  html,body{margin:0;width:1200px;height:630px;overflow:hidden}
  body{background:#111111;color:#F2F1ED;font-family:Inter,sans-serif;position:relative}
  .curves{position:absolute;inset:0}
  .wrap{position:absolute;inset:64px 72px;display:grid;grid-template-rows:auto 1fr auto}
  .top{display:flex;justify-content:space-between;align-items:flex-start}
  .wm{display:flex;align-items:flex-start}
  .wm b{font-weight:600;font-size:46px;line-height:.95;letter-spacing:-.045em}
  .wm svg{width:30px;height:82px;margin:-8px 0 0 6px}
  .badge{border:1.5px solid rgba(242,241,237,.35);border-radius:999px;padding:12px 22px;font-size:17px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:#C9C8C3}
  h1{align-self:end;margin:0;font-weight:600;font-size:76px;line-height:1.02;letter-spacing:-.045em;max-width:980px}
  h1 em{font-style:normal;color:#8E8D88}
  .foot{display:flex;justify-content:space-between;margin-top:30px;font-size:22px;color:#A3A29D}
  .foot b{color:#F2F1ED;font-weight:500}
</style></head>
<body>
  <svg class="curves" viewBox="0 0 1200 630" fill="none" stroke="#FFFFFF" stroke-opacity=".10" stroke-width="1.5"><path d="M-40 560C300 400 720 680 1240 260"/><path d="M-40 610C320 460 740 730 1240 330"/><path d="M560 -40C740 180 980 260 1240 200"/></svg>
  <div class="wrap">
    <div class="top">
      <div class="wm"><b>Sin<br>Etiquetas</b><svg viewBox="0 0 16 34"><line x1="1.5" y1="32.5" x2="14.5" y2="1.5" stroke="#F2F1ED" stroke-width="1.4" stroke-linecap="round"/></svg></div>
      <div class="badge">Generales · 29 de noviembre</div>
    </div>
    <h1>Vota por lo que piensas, <em>no por quién lo dice.</em></h1>
    <div class="foot"><span>Test electoral sin siglas · código y datos abiertos</span><b>votasinetiquetas.es</b></div>
  </div>
</body></html>
